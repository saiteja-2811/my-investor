name: Daily Brief

on:
  schedule:
    # 11:30 UTC Mon-Fri (= 6:30-7:30 AM ET depending on DST)
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python app/daily_brief.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SEC_USER_AGENT: ${{ secrets.GMAIL_USER }}
          # Optional — if ANTHROPIC_API_KEY is set, each ticker section gets a
          # 2-3 sentence LLM summary of the day's news/deals/filings above it.
          # ANTHROPIC_BASE_URL lets you route through a LiteLLM-compatible proxy.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
